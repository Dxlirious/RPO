org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true

# Обязательно: Android Gradle Plugin 8.x запускается на JVM 11+ (практически всегда нужен JDK 17).
# Если сборка падает с "This build uses a Java 8 JVM":
#   • Android Studio: File → Settings → Build, Execution, Deployment → Build Tools → Gradle →
#     "Gradle JDK" → выберите "Embedded JDK" или путь к JDK 17/21.
#   • Консоль Windows: установите JDK 17 (Temurin/Android Studio jbr) и:
#     set JAVA_HOME=C:\Program Files\Android\Android Studio\jbr
#     или раскомментируйте и поправьте путь:
# org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr
